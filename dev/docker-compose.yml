# Local services for trying the Database panel: `docker compose -f dev/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: tapcode-pg
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: demo
    ports:
      - "5440:5432"
  redis:
    image: redis:7-alpine
    container_name: tapcode-redis
    ports:
      - "6390:6379"
