[package]
name = "code-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Opensource IDE for PHP / JavaScript / TypeScript"
repository = "https://github.com/kaiyrkhan/code-editor"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
ropey = "1.6.1"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-php = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-yaml = "0.7.2"
rfd = "0.17.2"
ignore = "0.4.33"
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
streaming-iterator = "0.1.9"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
